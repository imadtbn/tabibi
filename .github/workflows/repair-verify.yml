name: Temporary repair verification

on:
  push:
    branches:
      - repair/dynamic-stats-ui

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: repair/dynamic-stats-ui
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build generated site
        run: python3 tools/build.py
      - name: Run full test suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build dynamic statistics UI"
            git push origin HEAD:repair/dynamic-stats-ui
          fi
