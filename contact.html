<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طبيبي | اتصل بنا</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contact-form {
            background: var(--bg-surface);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--bg-color);
            color: var(--text-primary);
        }
        .error-msg {
            color: var(--danger-color);
            font-size: 0.8rem;
            display: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-stethoscope"></i> طبيبي</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="about.html">من نحن</a></li>
                    <li><a href="contact.html" class="active">اتصل بنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container section-padding" style="max-width: 600px;">
        <h2 class="section-title">اتصل بنا</h2>

        <form class="contact-form" id="contactForm" onsubmit="event.preventDefault(); validateForm();">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="contactName" required>
                <div class="error-msg" id="nameError">يرجى إدخال اسم صحيح</div>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="contactEmail" required>
                <div class="error-msg" id="emailError">يرجى إدخال بريد إلكتروني صحيح</div>
            </div>
            <div class="form-group">
                <label>الرسالة</label>
                <textarea id="contactMessage" rows="5" required></textarea>
                <div class="error-msg" id="msgError">الرسالة قصيرة جداً</div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">إرسال الرسالة</button>
        </form>
    </main>

    <script>
        function validateForm() {
            const name = document.getElementById('contactName').value;
            const email = document.getElementById('contactEmail').value;
            const msg = document.getElementById('contactMessage').value;

            let isValid = true;

            if (name.length < 3) { document.getElementById('nameError').style.display = 'block'; isValid = false; }
            else { document.getElementById('nameError').style.display = 'none'; }

            if (!email.includes('@')) { document.getElementById('emailError').style.display = 'block'; isValid = false; }
            else { document.getElementById('emailError').style.display = 'none'; }

            if (msg.length < 10) { document.getElementById('msgError').style.display = 'block'; isValid = false; }
            else { document.getElementById('msgError').style.display = 'none'; }

            if (isValid) {
                alert('تم إرسال رسالتك بنجاح! (محاكاة)');
                document.getElementById('contactForm').reset();
            }
        }
    </script>
</body>
</html>
