<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طبيبي | الخريطة الطبية</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚕️</text></svg>">

    <style>
        .map-layout {
            display: flex;
            height: calc(100vh - 70px);
        }
        .map-sidebar {
            width: 350px;
            background: var(--bg-surface);
            box-shadow: var(--shadow-md);
            z-index: 10;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .map-container {
            flex: 1;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .filter-section {
            margin-bottom: 20px;
        }
        .filter-section label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .filter-section select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--bg-color);
            color: var(--text-primary);
        }
        .leaflet-popup-content {
            text-align: right;
            direction: rtl;
        }
        .map-popup-card h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .map-popup-card p { margin: 5px 0; font-size: 0.9rem; color: var(--text-secondary); }
        .map-popup-card .btn { margin-top: 10px; display: block; text-align: center; }

        @media (max-width: 768px) {
            .map-layout {
                flex-direction: column-reverse;
            }
            .map-sidebar {
                width: 100%;
                height: 40%;
            }
            .map-container {
                height: 60%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-stethoscope"></i> طبيبي
            </a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="map.html" class="active">الخريطة</a></li>
                    <li><a href="stats.html">الإحصائيات</a></li>
                    <li><a href="about.html">من نحن</a></li>
                    <li><a href="contact.html">اتصل بنا</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="darkModeToggle" class="btn-icon">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="mobile-menu-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="map-layout">
        <aside class="map-sidebar">
            <h2 style="margin-bottom: 20px; color: var(--primary-color);">تصفية الخريطة</h2>

            <div class="filter-section">
                <label>الاختصاص</label>
                <select id="mapSpecFilter">
                    <option value="all">جميع الاختصاصات</option>
                </select>
            </div>

            <div class="filter-section">
                <label>الولاية</label>
                <select id="mapWilayaFilter">
                    <option value="all">جميع الولايات</option>
                </select>
            </div>

            <button id="locateMeMapBtn" class="btn btn-outline" style="width: 100%; margin-bottom: 20px;">
                <i class="fa-solid fa-location-crosshairs"></i> الذهاب لموقعي
            </button>

            <!-- Google Ads Container Sidebar -->
            <div class="ad-container ad-sidebar" style="margin-top: auto;">
                <span class="ad-label">إعلان</span>
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="js/data/meta.js"></script>
    <script src="js/main.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
